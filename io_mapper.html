<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IO Mapper</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;600;800&display=swap" rel="stylesheet"/>

  <style>
    /* ============================================================
       CSS VARIABLES & RESET
    ============================================================ */
    :root {
      --bg:        #0b0e14;
      --panel:     #111620;
      --border:    #1e2a3a;
      --accent:    #00e5ff;
      --accent2:   #ff6b35;
      --text:      #cdd9e5;
      --muted:     #4a5a6e;
      --success:   #39ff14;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui:   'Barlow Condensed', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      background-image:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,229,255,.06) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(30,42,58,.4) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(30,42,58,.4) 40px);
    }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    header .label {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      line-height: 1;
      color: #fff;
    }

    header h1 span { color: var(--accent); }

    /* ============================================================
       GRID LAYOUT
    ============================================================ */
    .grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* ============================================================
       SIGNAL CARD
    ============================================================ */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }

    .card.has-value::before { transform: scaleX(1); }

    .card-type {
      font-family: var(--font-mono);
      font-size: .65rem;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: #fff;
    }

    /* ============================================================
       INPUT
    ============================================================ */
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    /* input styles live in .input-wrap block above */

    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: .9rem;
      padding: 10px 10px;
      cursor: pointer;
      transition: all .2s;
      line-height: 1;
    }
    .btn-clear:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ============================================================
       FORMULA CHIP
    ============================================================ */
    .formula {
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--muted);
      margin-bottom: 14px;
      padding: 6px 10px;
      background: rgba(255,255,255,.03);
      border-left: 2px solid var(--muted);
      border-radius: 0 2px 2px 0;
    }

    /* ============================================================
       OUTPUT TAGS
    ============================================================ */
    .outputs { display: flex; flex-direction: column; gap: 8px; }

    .output-tag {
      font-family: var(--font-mono);
      font-size: .78rem;
      padding: 8px 12px;
      background: rgba(0,229,255,.04);
      border: 1px solid rgba(0,229,255,.12);
      border-radius: 3px;
      color: var(--muted);
      word-break: break-all;
      transition: all .25s;
    }

    .output-tag.active {
      color: var(--success);
      border-color: rgba(57,255,20,.35);
      background: rgba(57,255,20,.05);
      animation: pulse-tag .4s ease;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .output-tag.active:hover {
      border-color: rgba(57,255,20,.7);
      background: rgba(57,255,20,.1);
    }

    .output-tag.active:hover::after {
      content: '⎘ copy';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .62rem;
      letter-spacing: .1em;
      color: var(--muted);
      pointer-events: none;
    }

    .output-tag.copied {
      border-color: var(--accent) !important;
      background: rgba(0,229,255,.12) !important;
      color: var(--accent) !important;
      animation: copied-flash .35s ease;
    }

    .output-tag.copied::after {
      content: '✓ copied' !important;
      color: var(--accent) !important;
    }

    @keyframes copied-flash {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .output-tag .placeholder { color: var(--muted); }
    .output-tag .index { color: var(--accent2); font-weight: bold; }

    @keyframes pulse-tag {
      0%   { transform: translateX(-4px); opacity: .5; }
      100% { transform: translateX(0);    opacity: 1; }
    }

    /* ============================================================
       TAB NAV
    ============================================================ */
    .tab-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      width: 100%;
      max-width: 900px;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 8px 18px;
      cursor: pointer;
      transition: all .2s;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-panel { display: none; width: 100%; max-width: 900px; }
    .tab-panel.active { display: block; }

    /* ============================================================
       INPUT WARNING TOOLTIP
    ============================================================ */
    .input-wrap { position: relative; flex: 1; }

    .input-wrap input[type="number"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 1.4rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -moz-appearance: textfield;
      width: 100%;
    }
    .input-wrap input[type="number"]::-webkit-inner-spin-button,
    .input-wrap input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .input-wrap input[type="number"]:focus { border-color: var(--accent); }

    .input-wrap input.out-of-range {
      border-color: var(--accent2) !important;
      box-shadow: 0 0 0 2px rgba(255,107,53,.18);
      color: var(--accent2);
    }

    .range-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: #1a1010;
      border: 1px solid var(--accent2);
      border-radius: 3px;
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: .68rem;
      color: var(--accent2);
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    .range-tooltip::after {
      content: '';
      position: absolute;
      top: 100%; left: 16px;
      border: 5px solid transparent;
      border-top-color: var(--accent2);
    }

    .input-wrap input.out-of-range ~ .range-tooltip { display: block; }

    /* ============================================================
       HARDWARE MAPPING TABLE
    ============================================================ */
    .hw-section {
      margin-bottom: 32px;
    }

    .hw-section-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 4px;
    }

    .hw-section-sub {
      font-family: var(--font-mono);
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .1em;
      margin-bottom: 14px;
    }

    .hw-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: .75rem;
    }

    .hw-table thead th {
      text-align: left;
      padding: 6px 12px;
      color: var(--muted);
      letter-spacing: .1em;
      font-size: .65rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    .hw-table tbody tr { transition: background .15s; }
    .hw-table tbody tr:hover { background: rgba(255,255,255,.03); }

    .hw-table tbody td {
      padding: 7px 12px;
      border-bottom: 1px solid rgba(30,42,58,.6);
      color: var(--text);
    }

    .hw-table tbody td:first-child { color: var(--accent2); }
    .hw-table tbody td:last-child  { color: var(--success); }

    .hw-table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      max-height: 320px;
      overflow-y: auto;
    }

    .hw-table-wrap::-webkit-scrollbar { width: 4px; }
    .hw-table-wrap::-webkit-scrollbar-track { background: transparent; }
    .hw-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ============================================================
       HISTORY PANEL
    ============================================================ */
    .history-wrap {
      width: 100%;
      max-width: 900px;
      margin-top: 28px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-header span {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .btn-clear-history {
      background: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: .65rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .btn-clear-history:hover { border-color: var(--accent2); color: var(--accent2); }

    #history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
    }

    #history-list::-webkit-scrollbar { width: 4px; }
    #history-list::-webkit-scrollbar-track { background: transparent; }
    #history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .history-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: baseline;
    }

    .history-item .hi-time { color: var(--muted); flex-shrink: 0; }
    .history-item .hi-type { color: var(--accent); letter-spacing: .08em; }
    .history-item .hi-input { color: #fff; }
    .history-item .hi-arrow { color: var(--muted); }
    .history-item .hi-result { color: var(--success); word-break: break-all; }

    /* empty state */
    .history-empty {
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header>
    <div class="label">// PLC Signal Calculator</div>
    <h1>IO <span>Mapper</span></h1>
  </header>

  <!-- ============================================================
       TAB NAVIGATION
  ============================================================ -->
  <nav class="tab-nav">
    <button class="tab-btn active" onclick="APP.switchTab('calculator')">// Calculator</button>
    <button class="tab-btn"        onclick="APP.switchTab('hardware')">// Hardware Mapping</button>
  </nav>

  <!-- ============================================================
       TAB: CALCULATOR
  ============================================================ -->
  <div class="tab-panel active" id="tab-calculator">

    <div class="grid" id="cards-grid">
      <!-- Cards injected by JS -->
    </div>

    <!-- HISTORY -->
    <div class="history-wrap">
      <div class="history-header">
        <span>// Calculation History</span>
        <button class="btn-clear-history" onclick="APP.clearHistory()">Clear</button>
      </div>
      <div id="history-list"><div class="history-empty">No calculations yet.</div></div>
    </div>

  </div><!-- /tab-calculator -->

  <!-- ============================================================
       TAB: HARDWARE MAPPING EXAMPLE
  ============================================================ -->
  <div class="tab-panel" id="tab-hardware">
    <div id="hw-content">
      <!-- Injected by JS -->
    </div>
  </div><!-- /tab-hardware -->

  <!-- ============================================================
       JAVASCRIPT
  ============================================================ -->
  <script>
  /* ============================================================
     CONFIGURATION
     Each signal type is fully described here. To add/modify
     signal types or outputs, edit this array only.
  ============================================================ */
  const SIGNAL_CONFIG = [
    {
      id: "digital",
      type: "Digital Signal",
      title: "Digital Signal",
      formulaLabel: "⌊ input / 2 ⌋",
      formula: (v) => Math.trunc(v / 2),
      range: { min: 0, max: 999 },
      outputs: [
        (idx) => `Internal_IO_Mapping_DI[${idx}]`,
        (idx) => `Internal_IO_Mapping_DO[${idx}]`,
      ],
    },
    {
      id: "analog",
      type: "Analog Signal",
      title: "Analog Signal",
      formulaLabel: "⌊ (input − 1000) / 8 ⌋",
      formula: (v) => Math.trunc((v - 1000) / 8),
      range: { min: 1000, max: 1999 },
      outputs: [
        (idx) => `"IoHmiMonitor.ioHmiMonitorDb".AI[${idx}]`,
        (idx) => `"IoHmiMonitor.ioHmiMonitorDb".AO[${idx}]`,
        (idx) => `Internal_IO_Mapping_AO[${idx}]`,
      ],
    },
    {
      id: "safety_di",
      type: "Safety Digital Input",
      title: "Safety Digital Input",
      formulaLabel: "⌊ (input − 2000) / 8 ⌋",
      formula: (v) => Math.trunc((v - 2000) / 8),
      range: { min: 2000, max: 2999 },
      outputs: [
        (idx) => `Internal_IO_Mapping_SafetyDI[${idx}]`,
      ],
    },
    {
      id: "safety_do",
      type: "Safety Digital Output",
      title: "Safety Digital Output",
      formulaLabel: "⌊ (input − 3000) / 6 ⌋",
      formula: (v) => Math.trunc((v - 3000) / 6),
      range: { min: 3000, max: 3999 },
      outputs: [
        (idx) => `Internal_IO_Mapping_SafetyDO[${idx}]`,
      ],
    },
  ];

  /* ============================================================
     STORAGE HELPERS  (cookie-based, fallback to localStorage)
  ============================================================ */
  const Storage = {
    HISTORY_KEY: "io_mapper_history",
    INPUT_KEY:   "io_mapper_inputs",

    _save(key, data) {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (_) {}
    },
    _load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) { return fallback; }
    },

    saveInputs(inputs)    { this._save(this.INPUT_KEY,   inputs); },
    loadInputs()          { return this._load(this.INPUT_KEY,   {}); },
    saveHistory(history)  { this._save(this.HISTORY_KEY, history); },
    loadHistory()         { return this._load(this.HISTORY_KEY, []); },
  };

  /* ============================================================
     APP STATE
  ============================================================ */
  const APP = (() => {
    let history = Storage.loadHistory();
    const savedInputs = Storage.loadInputs();

    /* ---------- BUILD CARDS ---------- */
    function buildCards() {
      const grid = document.getElementById("cards-grid");
      SIGNAL_CONFIG.forEach((cfg) => {
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${cfg.id}`;
        card.innerHTML = `
          <div class="card-type">${cfg.type}</div>
          <div class="card-title">${cfg.title}</div>
          <div class="input-row">
            <div class="input-wrap">
              <input
                type="number"
                id="input-${cfg.id}"
                placeholder="${cfg.range.min}"
                value="${savedInputs[cfg.id] ?? ""}"
                oninput="APP.onInput('${cfg.id}')"
              />
              <div class="range-tooltip">⚠ Valid range: ${cfg.range.min} – ${cfg.range.max}</div>
            </div>
            <button class="btn-clear" title="Clear" onclick="APP.clearInput('${cfg.id}')">✕</button>
          </div>
          <div class="formula">${cfg.formulaLabel}</div>
          <div class="outputs" id="outputs-${cfg.id}">
            ${cfg.outputs.map((fn, i) => outputTagHTML(cfg, i, null)).join("")}
          </div>
        `;
        grid.appendChild(card);

        // If we have a saved value, compute immediately
        if (savedInputs[cfg.id] !== undefined && savedInputs[cfg.id] !== "") {
          computeCard(cfg.id, false);
        }
      });
    }

    /* ---------- OUTPUT TAG HTML ---------- */
    function outputTagHTML(cfg, outputIndex, computedIndex) {
      const template = cfg.outputs[outputIndex]("__IDX__");
      if (computedIndex === null) {
        // Placeholder state
        const withPlaceholder = template.replace("__IDX__", '<span class="placeholder">?</span>');
        return `<div class="output-tag" id="out-${cfg.id}-${outputIndex}">${withPlaceholder}</div>`;
      }
      // Active state — clickable to copy plain text value
      const plainText = cfg.outputs[outputIndex](computedIndex);
      const withIndex = template.replace("__IDX__", `<span class="index">${computedIndex}</span>`);
      return `<div class="output-tag active" id="out-${cfg.id}-${outputIndex}" onclick="APP.copyToClipboard('${plainText.replace(/'/g, "\\'")}', this)">${withIndex}</div>`;
    }

    /* ---------- COMPUTE CARD ---------- */
    function computeCard(id, addToHistory = true) {
      const cfg = SIGNAL_CONFIG.find((c) => c.id === id);
      const inputEl = document.getElementById(`input-${id}`);
      const card    = document.getElementById(`card-${id}`);
      const raw     = inputEl.value.trim();

      if (raw === "") {
        resetCard(cfg);
        return;
      }

      const v = parseFloat(raw);
      if (isNaN(v)) { resetCard(cfg); return; }

      // Range validation — show/hide tooltip via CSS class
      const inputEl2 = document.getElementById(`input-${id}`);
      if (v < cfg.range.min || v > cfg.range.max) {
        inputEl2.classList.add("out-of-range");
        resetCard(cfg);
        return;
      }
      inputEl2.classList.remove("out-of-range");

      const idx = cfg.formula(v);
      const outputContainer = document.getElementById(`outputs-${id}`);

      // Update each output tag
      cfg.outputs.forEach((_, i) => {
        const el = document.getElementById(`out-${id}-${i}`);
        if (el) {
          const temp = document.createElement("div");
          temp.innerHTML = outputTagHTML(cfg, i, idx);
          const newEl = temp.firstElementChild;
          // Trigger animation by replacing node
          el.replaceWith(newEl);
        }
      });

      card.classList.add("has-value");

      // Persist input
      const inputs = Storage.loadInputs();
      inputs[id] = raw;
      Storage.saveInputs(inputs);

      // History entry
      if (addToHistory) {
        const results = cfg.outputs.map((fn) => fn(idx));
        addHistoryEntry(cfg.title, v, idx, results);
      }
    }

    /* ---------- RESET CARD ---------- */
    function resetCard(cfg) {
      const card = document.getElementById(`card-${cfg.id}`);
      card.classList.remove("has-value");

      cfg.outputs.forEach((_, i) => {
        const el = document.getElementById(`out-${cfg.id}-${i}`);
        if (el) {
          el.className = "output-tag";
          const temp = document.createElement("div");
          temp.innerHTML = outputTagHTML(cfg, i, null);
          el.replaceWith(temp.firstElementChild);
        }
      });

      const inputs = Storage.loadInputs();
      delete inputs[cfg.id];
      Storage.saveInputs(inputs);
    }

    /* ---------- COPY TO CLIPBOARD ---------- */
    function copyToClipboard(text, el) {
      navigator.clipboard.writeText(text).then(() => {
        el.classList.add("copied");
        setTimeout(() => el.classList.remove("copied"), 1200);
      }).catch(() => {
        // Fallback for older browsers
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        el.classList.add("copied");
        setTimeout(() => el.classList.remove("copied"), 1200);
      });
    }

    /* ---------- EVENT HANDLERS ---------- */
    function onInput(id) {
      computeCard(id, true);
    }

    function clearInput(id) {
      const inputEl = document.getElementById(`input-${id}`);
      inputEl.value = "";
      inputEl.classList.remove("out-of-range");
      const cfg = SIGNAL_CONFIG.find((c) => c.id === id);
      resetCard(cfg);
    }

    /* ---------- TAB SWITCHING ---------- */
    function switchTab(tabId) {
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      document.getElementById(`tab-${tabId}`).classList.add("active");
      document.querySelector(`.tab-btn[onclick*="${tabId}"]`).classList.add("active");
    }

    /* ---------- HARDWARE MAPPING TABLE ---------- */
    function buildHardwareMapping() {
      /*
        HARDWARE_MAP defines each section.
        step   = size of each address block
        count  = number of rows to show
        base   = starting address
        label  = section heading
        index  = fn(rowIndex) => array index shown in output column
      */
      const HARDWARE_MAP = [
        {
          label: "Digital Signal",
          sub:   "Range 0–999 · step 2 · index = ⌊addr/2⌋",
          base:  0, step: 2, count: 20,
          addrFmt: (b, s) => `${b}..${b + s - 1}`,
          indexFmt: (i) => `[${i}]`,
        },
        {
          label: "Analog Signal",
          sub:   "Range 1000–1999 · step 8 · index = ⌊(addr−1000)/8⌋",
          base:  1000, step: 8, count: 20,
          addrFmt: (b, s) => `${b}..${b + s - 1}`,
          indexFmt: (i) => `[${i}]`,
        },
        {
          label: "Safety Digital Input",
          sub:   "Range 2000–2999 · step 8 · index = ⌊(addr−2000)/8⌋",
          base:  2000, step: 8, count: 20,
          addrFmt: (b, s) => `${b}..${b + s - 1}`,
          indexFmt: (i) => `[${i}]`,
        },
        {
          label: "Safety Digital Output",
          sub:   "Range 3000–3999 · step 6 · index = ⌊(addr−3000)/6⌋",
          base:  3000, step: 6, count: 20,
          addrFmt: (b, s) => `${b}..${b + s - 1}`,
          indexFmt: (i) => `[${i}]`,
        },
      ];

      // Map section to matching SIGNAL_CONFIG for output label
      const cfgMap = { "Digital Signal": "digital", "Analog Signal": "analog",
                       "Safety Digital Input": "safety_di", "Safety Digital Output": "safety_do" };

      const container = document.getElementById("hw-content");
      container.innerHTML = HARDWARE_MAP.map((section) => {
        const cfg = SIGNAL_CONFIG.find((c) => c.id === cfgMap[section.label]);
        const rows = Array.from({ length: section.count }, (_, i) => {
          const blockStart = section.base + i * section.step;
          const blockEnd   = blockStart + section.step - 1;
          const idx        = i;
          const outputs    = cfg.outputs.map((fn) => fn(idx)).join(" / ");
          return `
            <tr>
              <td>${blockStart}..${blockEnd}</td>
              <td>${section.indexFmt(idx)}</td>
              <td>${outputs}</td>
            </tr>`;
        }).join("");

        return `
          <div class="hw-section">
            <div class="hw-section-title">${section.label}</div>
            <div class="hw-section-sub">${section.sub}</div>
            <div class="hw-table-wrap">
              <table class="hw-table">
                <thead>
                  <tr>
                    <th>Address Block</th>
                    <th>Index</th>
                    <th>Output Mapping</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>`;
      }).join("");
    }

    /* ---------- HISTORY ---------- */
    function addHistoryEntry(typeLabel, inputVal, idx, results) {
      const entry = {
        time: new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        type: typeLabel,
        input: inputVal,
        idx,
        results,
      };
      history.unshift(entry);
      if (history.length > 50) history = history.slice(0, 50);
      Storage.saveHistory(history);
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      if (!history.length) {
        list.innerHTML = '<div class="history-empty">No calculations yet.</div>';
        return;
      }
      list.innerHTML = history.map((e) => `
        <div class="history-item">
          <span class="hi-time">${e.time}</span>
          <span class="hi-type">${e.type}</span>
          <span class="hi-input">${e.input}</span>
          <span class="hi-arrow">→</span>
          <span class="hi-result">${e.results.join(" | ")}</span>
        </div>
      `).join("");
    }

    function clearHistory() {
      history = [];
      Storage.saveHistory(history);
      renderHistory();
    }

    /* ---------- INIT ---------- */
    function init() {
      buildCards();
      renderHistory();
      buildHardwareMapping();
    }

    return { init, onInput, clearInput, clearHistory, copyToClipboard, switchTab };
  })();

  /* ============================================================
     BOOT
  ============================================================ */
  document.addEventListener("DOMContentLoaded", APP.init);
  </script>
</body>
</html>
